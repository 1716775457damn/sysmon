name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sysmon.exe
            asset_name: sysmon-windows-x86_64.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sysmon
            asset_name: sysmon-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sysmon
            asset_name: sysmon-macos-aarch64

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: sysmon
            asset_name: sysmon-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # vendored-libgit2 + vendored-openssl compile everything from source,
      # but still need cmake and a C compiler on all platforms.
      - name: Install Linux build tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} \
             ${{ matrix.asset_name }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact }}" `
                    "${{ matrix.asset_name }}"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
